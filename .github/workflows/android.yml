name: Godot Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          cp -r /root/.config/godot ~/.config/
      - name: Install Android build tools
        run: |
          SDK=$(grep -rhoP 'android_sdk_path = "\K[^"]+' /root/.config/godot | head -1)
          echo "SDK=$SDK"
          SM=$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SM" --sdk_root="$SDK" "build-tools;34.0.0" "platforms;android-34"
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/game.apk
      - uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/game.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Neon Survivor v${{ github.run_number }}
          files: build/game.apk
