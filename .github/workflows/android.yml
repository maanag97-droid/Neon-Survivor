name: Godot Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Export APK
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/game.apk
      - uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/game.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Neon Survivor v${{ github.run_number }}
          files: build/game.apk
